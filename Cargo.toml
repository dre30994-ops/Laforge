[workspace]
members = ["crates/staking-math", "programs/staking"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
staking-math = { path = "crates/staking-math", default-features = false }

# Overflow checks stay ON in release. The math layer uses checked arithmetic
# throughout, but a silent wrap anywhere in a staking program is a fund-loss
# bug, so the belt-and-braces cost is worth it.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
