name = "laforge-pool-meta"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# KV holds JSON metadata keyed by lowercased token (and optionally pool) address.
[[kv_namespaces]]
binding = "META"
id = "replace-with-kv-namespace-id"

# R2 holds raster pool images / banners. Public access is via this worker.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "laforge-pool-images"

# Per-chain factory + RPC. The worker never trusts a client-supplied tier;
# it resolves factory.poolOf(token) on the matching chain, then pool.tier().
[vars]
FACTORY_4663 = "0x0E69CcAfB4f8bFBA970750703fc3154ff0D01691"
RPC_4663 = "https://rpc.mainnet.chain.robinhood.com"

FACTORY_1 = "0x84ee0716F5Af308Ce3D265962a9237e353fD0c6f"
RPC_1 = "https://ethereum.publicnode.com"

FACTORY_8453 = "0x84ee0716F5Af308Ce3D265962a9237e353fD0c6f"
RPC_8453 = "https://base.publicnode.com"

FACTORY_56 = "0x84ee0716F5Af308Ce3D265962a9237e353fD0c6f"
RPC_56 = "https://bsc.publicnode.com"

FACTORY_999 = "0x84ee0716F5Af308Ce3D265962a9237e353fD0c6f"
RPC_999 = "https://rpc.hyperliquid.xyz/evm"
