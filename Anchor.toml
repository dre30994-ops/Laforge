[toolchain]
anchor_version = "1.1.2"
solana_version = "3.1.10"

[features]
resolution = true
skip-lint = false

[programs.localnet]
staking = "9w1J2JrEuLqN4dL8NEUAdW3aubzzTXpSc9pG3mYdEgUL"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Integration tests use LiteSVM as a Rust harness, so they run under cargo.
# They load target/deploy/staking.so, so `anchor build` must run first.
test = "cargo test -p staking-tests -- --nocapture"
