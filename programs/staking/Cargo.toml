[package]
name = "staking"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "14-day liquidity-bootstrap staking farm with ramped emissions and per-user tenure weighting."

[lib]
crate-type = ["cdylib", "lib"]
name = "staking"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
# default-features = false keeps the host-only reference model out of the
# on-chain binary; only constants/emission/weight/accrual are linked.
staking-math = { workspace = true }
