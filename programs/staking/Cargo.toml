[package]
name = "staking"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "14-day liquidity-bootstrap staking farm with ramped emissions and per-user tenure weighting."

[lib]
crate-type = ["cdylib", "lib"]
name = "staking"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Test-only: makes initialize_pool set the operator to the pool authority so
# integration tests (which cannot hold the hardcoded operator's secret key) can
# exercise operator-gated funding and the sweep. NEVER enable in production.
test-operator = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
bytemuck = { version = "1.25", features = ["min_const_generics", "derive"] }
# default-features = false keeps the host-only reference model out of the
# on-chain binary; only constants/emission/weight/accrual are linked.
staking-math = { workspace = true }
