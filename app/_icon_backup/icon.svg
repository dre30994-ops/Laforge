<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Forge">
  <!-- Black rounded tile -->
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="#2a1f0a" stroke-width="3"/>

  <!-- Flat gold castle silhouette -->
  <g fill="#e8bf4a">
    <!-- Main keep body -->
    <rect x="196" y="214" width="120" height="150"/>
    <!-- Left tower -->
    <rect x="132" y="238" width="66" height="126"/>
    <!-- Right tower -->
    <rect x="314" y="238" width="66" height="126"/>
    <!-- Central tall tower -->
    <rect x="230" y="150" width="52" height="80"/>

    <!-- Crenellations: left tower -->
    <rect x="132" y="226" width="16" height="16"/>
    <rect x="157" y="226" width="16" height="16"/>
    <rect x="182" y="226" width="16" height="16"/>
    <!-- Crenellations: right tower -->
    <rect x="314" y="226" width="16" height="16"/>
    <rect x="339" y="226" width="16" height="16"/>
    <rect x="364" y="226" width="16" height="16"/>
    <!-- Crenellations: keep -->
    <rect x="196" y="202" width="18" height="16"/>
    <rect x="224" y="202" width="18" height="16"/>
    <rect x="272" y="202" width="18" height="16"/>
    <rect x="298" y="202" width="18" height="16"/>
    <!-- Crenellations: central tower -->
    <rect x="230" y="138" width="15" height="14"/>
    <rect x="253" y="138" width="15" height="14"/>

    <!-- Central tower roof spire -->
    <polygon points="230,150 256,110 282,150"/>
    <!-- Flag -->
    <rect x="253" y="86" width="4" height="26"/>
    <polygon points="257,88 285,96 257,104"/>

    <!-- Gate (cut out of keep) -->
  </g>
  <!-- Gate opening (black arch) -->
  <path d="M232 364 v-40 a24 24 0 0 1 48 0 v40 z" fill="#000000"/>

  <!-- Ground line -->
  <rect x="120" y="364" width="272" height="10" fill="#e8bf4a"/>

  <!-- Gold particles around the castle -->
  <g fill="#f9edc4">
    <circle cx="96" cy="130" r="6"/>
    <circle cx="128" cy="96" r="3.5"/>
    <circle cx="72" cy="200" r="4"/>
    <circle cx="104" cy="300" r="5"/>
    <circle cx="88" cy="380" r="3"/>
    <circle cx="416" cy="140" r="6"/>
    <circle cx="384" cy="100" r="3.5"/>
    <circle cx="440" cy="210" r="4.5"/>
    <circle cx="408" cy="300" r="5"/>
    <circle cx="428" cy="382" r="3"/>
    <circle cx="256" cy="60" r="4"/>
    <circle cx="180" cy="70" r="3"/>
    <circle cx="332" cy="66" r="3.5"/>
  </g>
  <g fill="#e8bf4a" opacity="0.6">
    <circle cx="150" cy="150" r="2.5"/>
    <circle cx="362" cy="160" r="2.5"/>
    <circle cx="60" cy="260" r="2.5"/>
    <circle cx="452" cy="270" r="2.5"/>
    <circle cx="210" cy="50" r="2"/>
    <circle cx="300" cy="48" r="2"/>
  </g>
</svg>
