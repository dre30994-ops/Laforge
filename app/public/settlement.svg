<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <!-- Ground base -->
  <rect width="1200" height="800" fill="#1a1a0f"/>
  
  <!-- Forest/field surrounding the settlement -->
  <ellipse cx="600" cy="400" rx="550" ry="350" fill="#1f2b15" opacity="0.8"/>
  <ellipse cx="600" cy="400" rx="400" ry="260" fill="#2a3520"/>
  
  <!-- Roads (crossing paths) -->
  <line x1="600" y1="100" x2="600" y2="700" stroke="#3d3525" stroke-width="12"/>
  <line x1="200" y1="400" x2="1000" y2="400" stroke="#3d3525" stroke-width="10"/>
  <line x1="350" y1="200" x2="850" y2="600" stroke="#3d3525" stroke-width="8"/>
  <line x1="850" y1="200" x2="350" y2="600" stroke="#3d3525" stroke-width="8"/>
  
  <!-- Central plaza/square -->
  <rect x="530" y="340" width="140" height="120" rx="4" fill="#4a3d2a" opacity="0.9"/>
  <rect x="545" y="355" width="110" height="90" rx="2" fill="#3d3020" opacity="0.8"/>
  
  <!-- Castle/keep (center) -->
  <rect x="565" y="365" width="70" height="60" fill="#5c4832"/>
  <rect x="570" y="370" width="60" height="50" fill="#4a3828"/>
  <rect x="563" y="363" width="8" height="8" fill="#6b5540"/>
  <rect x="629" y="363" width="8" height="8" fill="#6b5540"/>
  <rect x="563" y="417" width="8" height="8" fill="#6b5540"/>
  <rect x="629" y="417" width="8" height="8" fill="#6b5540"/>
  <!-- Castle inner -->
  <rect x="585" y="380" width="30" height="25" fill="#5c4832"/>
  <rect x="595" y="395" width="10" height="10" fill="#2a1f15"/>
  
  <!-- Buildings - NW quadrant -->
  <rect x="440" y="260" width="30" height="22" fill="#4a3828" transform="rotate(15 455 271)"/>
  <rect x="470" y="280" width="25" height="18" fill="#5c4832" transform="rotate(-5 482 289)"/>
  <rect x="420" y="300" width="28" height="20" fill="#4a3828"/>
  <rect x="460" y="310" width="22" height="16" fill="#3d2c1e"/>
  <rect x="430" y="340" width="26" height="20" fill="#5c4832"/>
  
  <!-- Buildings - NE quadrant -->
  <rect x="700" y="270" width="28" height="22" fill="#4a3828" transform="rotate(-10 714 281)"/>
  <rect x="740" y="290" width="24" height="18" fill="#5c4832"/>
  <rect x="710" y="320" width="30" height="20" fill="#3d2c1e" transform="rotate(5 725 330)"/>
  <rect x="680" y="300" width="22" height="16" fill="#4a3828"/>
  <rect x="720" y="340" width="25" height="18" fill="#5c4832"/>
  
  <!-- Buildings - SW quadrant -->
  <rect x="430" y="440" width="28" height="22" fill="#4a3828"/>
  <rect x="465" y="455" width="24" height="18" fill="#5c4832" transform="rotate(8 477 464)"/>
  <rect x="440" y="480" width="26" height="20" fill="#3d2c1e"/>
  <rect x="470" y="500" width="22" height="16" fill="#4a3828" transform="rotate(-5 481 508)"/>
  
  <!-- Buildings - SE quadrant -->
  <rect x="700" y="440" width="28" height="22" fill="#4a3828" transform="rotate(-8 714 451)"/>
  <rect x="730" y="460" width="24" height="18" fill="#5c4832"/>
  <rect x="710" y="490" width="26" height="20" fill="#3d2c1e"/>
  <rect x="680" y="470" width="22" height="16" fill="#4a3828"/>
  
  <!-- Town wall (circular) -->
  <circle cx="600" cy="400" r="200" stroke="#5c4832" stroke-width="6" fill="none" opacity="0.7"/>
  <!-- Gate openings -->
  <line x1="600" y1="198" x2="600" y2="208" stroke="#1a1a0f" stroke-width="14"/>
  <line x1="600" y1="592" x2="600" y2="602" stroke="#1a1a0f" stroke-width="14"/>
  <line x1="398" y1="400" x2="408" y2="400" stroke="#1a1a0f" stroke-width="14"/>
  <line x1="792" y1="400" x2="802" y2="400" stroke="#1a1a0f" stroke-width="14"/>
  
  <!-- Wall towers -->
  <circle cx="600" cy="200" r="10" fill="#6b5540"/>
  <circle cx="600" cy="600" r="10" fill="#6b5540"/>
  <circle cx="400" cy="400" r="10" fill="#6b5540"/>
  <circle cx="800" cy="400" r="10" fill="#6b5540"/>
  <circle cx="460" cy="260" r="8" fill="#6b5540"/>
  <circle cx="740" cy="260" r="8" fill="#6b5540"/>
  <circle cx="460" cy="540" r="8" fill="#6b5540"/>
  <circle cx="740" cy="540" r="8" fill="#6b5540"/>
  
  <!-- Farmland patches outside walls -->
  <rect x="150" y="200" width="60" height="40" fill="#2a3520" opacity="0.6" rx="2"/>
  <rect x="180" y="260" width="50" height="35" fill="#253018" opacity="0.5" rx="2"/>
  <rect x="950" y="250" width="55" height="38" fill="#2a3520" opacity="0.6" rx="2"/>
  <rect x="970" y="310" width="45" height="30" fill="#253018" opacity="0.5" rx="2"/>
  <rect x="200" y="500" width="50" height="40" fill="#2a3520" opacity="0.5" rx="2"/>
  <rect x="920" y="500" width="55" height="35" fill="#2a3520" opacity="0.5" rx="2"/>
  
  <!-- Trees (small dots around exterior) -->
  <circle cx="150" cy="150" r="6" fill="#1f3015" opacity="0.7"/>
  <circle cx="180" cy="130" r="5" fill="#1f3015" opacity="0.6"/>
  <circle cx="130" cy="170" r="7" fill="#253818" opacity="0.7"/>
  <circle cx="1020" cy="160" r="6" fill="#1f3015" opacity="0.7"/>
  <circle cx="1050" cy="180" r="5" fill="#253818" opacity="0.6"/>
  <circle cx="100" cy="600" r="7" fill="#1f3015" opacity="0.7"/>
  <circle cx="1080" cy="580" r="6" fill="#1f3015" opacity="0.6"/>
  <circle cx="120" cy="400" r="5" fill="#253818" opacity="0.7"/>
  <circle cx="1060" cy="420" r="5" fill="#1f3015" opacity="0.6"/>
  
  <!-- River/stream on east side -->
  <path d="M900 0 Q920 100 910 200 Q895 300 920 400 Q940 500 910 600 Q890 700 920 800" 
        stroke="#1a3040" stroke-width="15" fill="none" opacity="0.5"/>
  <path d="M900 0 Q920 100 910 200 Q895 300 920 400 Q940 500 910 600 Q890 700 920 800" 
        stroke="#254050" stroke-width="8" fill="none" opacity="0.4"/>
  
  <!-- Warm light glow from buildings (candles/fires) -->
  <circle cx="595" cy="390" r="15" fill="#b8860b" opacity="0.08"/>
  <circle cx="455" cy="275" r="8" fill="#b8860b" opacity="0.06"/>
  <circle cx="725" cy="285" r="8" fill="#b8860b" opacity="0.06"/>
  <circle cx="445" cy="455" r="8" fill="#b8860b" opacity="0.05"/>
  <circle cx="715" cy="455" r="8" fill="#b8860b" opacity="0.05"/>
  
  <!-- Subtle gold overlay for warmth -->
  <rect width="1200" height="800" fill="url(#goldVignette)" opacity="0.3"/>
  
  <defs>
    <radialGradient id="goldVignette" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#b8860b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
</svg>
